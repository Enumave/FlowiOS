name: iOS build
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate iOS project
        run: pnpm tauri ios init --ci

      - name: Disable code signing in Xcode project
        run: |
          python3 - <<'PY'
          import re, glob
          p = glob.glob('src-tauri/gen/apple/*.xcodeproj/project.pbxproj')[0]
          s = open(p).read()
          keys = 'DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|PROVISIONING_PROFILE_SPECIFIER'
          s = re.sub(r'^[ \t]*"?(' + keys + r')[^=\n]*=[^;\n]*;[ \t]*\n', '', s, flags=re.M)
          add = 'buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = "";\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
          s = s.replace('buildSettings = {', add)
          open(p, 'w').write(s)
          print('patched', p)
          PY
          grep -c "CODE_SIGNING_ALLOWED" src-tauri/gen/apple/*.xcodeproj/project.pbxproj

      - name: Build
        continue-on-error: true
        run: pnpm tauri ios build --export-method debugging

      - name: Package unsigned IPA
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" src-tauri/gen/apple -type d -name "*.app" -path "*iphoneos*" 2>/dev/null | head -n 1)
          echo "Found: $APP"
          test -n "$APP"
          find "$APP" -maxdepth 1 -type f -size +5M | grep -q . || { echo "No real app binary, build failed"; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Flow-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: flow-ios
          path: out/Flow-unsigned.ipa
          if-no-files-found: warn
