name: iOS build
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply iOS port
        run: python3 ios-port.py
      
      - name: Apply iPad interface changes
        run: python3 ios-ui.py

      - name: Apply phone and tablet layouts from Flow for Android
        run: python3 ios-adaptive.py

      - name: Settle the mini player into corners like Android
        run: python3 ios-mini-player.py
      
      - name: Fade the Watch page when the player is dragged to the mini player
        run: python3 ios-sheet-fade.py

      - name: Hide the home bar during fullscreen video
        run: python3 ios-immersive.py

      - name: Stop taps acting as hover on video cards
        run: python3 ios-home-cards.py

      - name: Inject logo.png into Tauri icons folder
        run: |
          mkdir -p src-tauri/icons || true
          cp Assets/logo.png src-tauri/icons/icon.png

      - name: Add iOS-specific AppIcon assets  
        run: |
          mkdir -p src-tauri/icons/ios 2>/dev/null || true
          cp Assets/logo.png src-tauri/icons/ios/AppIcon-512@2x.png
      
      - name: Regenerate all required icon sizes
        run: python3 -m pip install Pillow --quiet --break-system-packages || python3 -m pip install Pillow --quiet

      - name: Generate iOS project  
        run: pnpm tauri ios init --ci

      - name: Generate iOS project
        run: pnpm tauri ios init --ci

      - name: Disable code signing in Xcode project
        run: |
          python3 - <<'PY'
          import re, glob
          p = glob.glob('src-tauri/gen/apple/*.xcodeproj/project.pbxproj')[0]
          s = open(p).read()
          keys = 'DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|PROVISIONING_PROFILE_SPECIFIER'
          s = re.sub(r'^[ \t]*"?(' + keys + r')[^=\n]*=[^;\n]*;[ \t]*\n', '', s, flags=re.M)
          add = 'buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = "";\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
          s = s.replace('buildSettings = {', add)
          open(p, 'w').write(s)
          print('patched', p)
          PY

      - name: Build
        run: pnpm tauri ios build --export-method debugging 2>&1 | tee build.log || true

      - name: Show Rust errors
        if: always()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log | grep -E -A8 "^error" | head -150 || true

      - name: Package unsigned IPA
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" src-tauri/gen/apple -type d -name "*.app" -path "*iphoneos*" 2>/dev/null | head -n 1)
          echo "Found: $APP"
          test -n "$APP"
          find "$APP" -maxdepth 1 -type f -size +5M | grep -q . || { echo "No real app binary, build failed"; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Flow-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: flow-ios
          path: out/Flow-unsigned.ipa
          if-no-files-found: warn
